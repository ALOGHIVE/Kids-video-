name: Kids Story Generator

on:
  workflow_dispatch:

jobs:
  generate-story:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate children's story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator/story_generator.py

      - name: Generate narration
        run: |
          python creator/voice_generator.py

      - name: Generate scene plan
        run: |
          python creator/scene_generator.py

      - name: Generate scene images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator/image_generator.py

      - name: Save generated episode assets
        uses: actions/upload-artifact@v4
        with:
          name: kids-episode-assets
          path: output/
          if-no-files-found: error
