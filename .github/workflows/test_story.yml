name: Kids Story Generator

on:
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install everything in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Generate the children's story
      - name: Generate children's story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator/story_generator.py

      # 5. Turn the story into narration
      - name: Generate narration
        run: |
          python creator/voice_generator.py

      # 6. Create the visual scene plan
      - name: Generate scene plan
        run: |
          python creator/scene_generator.py

      # 7. Save everything as a downloadable artifact
      - name: Save generated content
        uses: actions/upload-artifact@v4
        with:
          name: kids-episode-assets
          path: output/
          if-no-files-found: error
