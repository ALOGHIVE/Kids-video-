name: NobiNest Kids Episode Generator

on:
  workflow_dispatch:

  schedule:
    # Runs every day at 12:00 UTC
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  generate-episode:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # CHECKOUT
      # ----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # PYTHON
      # ----------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ----------------------------------------
      # INSTALL FFMPEG
      # ----------------------------------------

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ----------------------------------------
      # INSTALL PYTHON DEPENDENCIES
      # ----------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts pillow


      # ----------------------------------------
      # PREPARE OUTPUT
      # ----------------------------------------

      - name: Prepare output directory
        run: |
          rm -rf output
          mkdir -p output
          mkdir -p output/scenes


      # ----------------------------------------
      # GENERATE STORY
      # ----------------------------------------

      - name: Generate children's story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator/story_generator.py


      # ----------------------------------------
      # GENERATE NARRATION
      # ----------------------------------------

      - name: Generate narration
        run: |
          python creator/voice_generator.py


      # ----------------------------------------
      # GENERATE VIDEO
      # ----------------------------------------

      - name: Render children's video
        run: |
          python creator/video_renderer.py


      # ----------------------------------------
      # CHECK FILES
      # ----------------------------------------

      - name: Check generated files
        run: |
          echo "Generated files:"
          find output -maxdepth 2 -type f -printf "%p %s bytes\n"

          echo ""
          echo "Video information:"
          ffprobe -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/nobinnest_episode.mp4


      # ----------------------------------------
      # UPLOAD EPISODE
      # ----------------------------------------

      - name: Upload episode
        uses: actions/upload-artifact@v4
        with:
          name: nobinest-kids-episode
          path: |
            output/nobinnest_episode.mp4
            output/story.json
            output/story.txt
            output/narration.mp3
            output/narration.srt
            output/scenes/*.png
          if-no-files-found: error
          retention-days: 7
