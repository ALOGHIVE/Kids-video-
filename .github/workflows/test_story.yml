name: NobiNest Kids Episode Generator

on:
  workflow_dispatch:
  schedule:
  # Generate one new episode every day at 12:00
    - cron: "0 12 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  generate-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai edge-tts pillow

      - name: Prepare output
        run: |
          rm -rf output
          mkdir -p output/scenes

      - name: Generate story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python creator/story_generator.py

      - name: Generate narration
        run: |
          python creator/voice_generator.py

      - name: Render animated video
        run: |
          python creator/video_renderer.py

      - name: Verify episode duration
        run: |
          test -f output/nobinnest_episode.mp4

          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/nobinnest_episode.mp4)

          echo "Episode duration: ${DURATION}s"

          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if duration < 60 or duration > 90:
              raise SystemExit(
                  f"ERROR: Episode duration {duration:.2f}s is outside 60-90 seconds."
              )
          print(f"PASS: Episode duration {duration:.2f}s is within 60-90 seconds.")
          PY

      - name: Verify files
        run: |
          test -f output/story.json
          test -f output/story.txt
          test -f output/narration.mp3
          test -f output/narration.srt

          ffprobe -v error output/nobinnest_episode.mp4

      - name: Upload episode
        uses: actions/upload-artifact@v4
        with:
          name: nobinest-kids-episode
          path: |
            output/nobinnest_episode.mp4
            output/story.json
            output/story.txt
            output/narration.mp3
            output/narration.srt
            output/scenes/*.png
          if-no-files-found: error
          retention-days: 7
          
